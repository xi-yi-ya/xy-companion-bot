<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陪伴 Bot · QQ 登录</title>
<style>body{margin:0;background:#f4f6f1;color:#2d4538;font:16px/1.7 "Microsoft YaHei",sans-serif}main{max-width:700px;margin:5vh auto;padding:30px}h1{font-size:30px;margin:5px 0}small{letter-spacing:2px;color:#748b7b}.card{background:white;border:1px solid #dce5db;border-radius:20px;padding:28px;margin-top:22px}.qr{text-align:center}img{width:260px;height:260px;max-width:100%;image-rendering:pixelated}button,a{font:inherit;color:#42674e}button{cursor:pointer;border:1px solid #cad7ca;border-radius:8px;background:#edf3eb;padding:8px 16px}button:disabled{cursor:default;opacity:.5}pre{background:#f0f4ed;padding:14px;border-radius:8px;white-space:pre-wrap;user-select:all}p{margin:10px 0}.muted{color:#748575;font-size:14px}[hidden]{display:none!important}.state{font-weight:600;font-size:20px}</style></head>
<body><main><small>YOUR LOCAL COMPANION</small><h1>把我接到 QQ</h1><p>本地 Web 的人设、记忆和长期习惯会一起带过去。</p>
<section class="card qr"><p id="state" class="state">正在读取 QQ 状态…</p><img id="qr" alt="QQ 登录二维码" hidden><p id="hint">使用 Bot 小号的手机 QQ 扫码，并在手机上确认登录。</p><button id="refresh">刷新二维码</button><p class="muted">二维码会在后台自动更新。可以把页面留到早上再扫描。</p></section>
<section id="pairing" class="card" hidden><strong>首次使用：绑定你的主号</strong><p>扫码登录后，用你的主号加 Bot 小号为好友，再将下面整行内容私聊发给 Bot：</p><pre id="command"></pre><p class="muted">绑定前不将 QQ 消息送入模型；绑定后仅响应你的主号私聊。绑定口令只在这台电脑显示。</p></section>
<p id="owner" class="muted"></p><p><a href="/#/plugin-view/astrbot_plugin_companion_memory/memories">打开 Bot 设置</a> · <a href="/#/chatbox">本地聊天</a></p>
</main><script>
const base='/api/v1/plugins/extensions/astrbot_plugin_companion_memory/',el=id=>document.getElementById(id);let polling=false;
async function update(){if(polling)return;polling=true;try{const r=await fetch(base+'qq',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const phases={qrcode_scanned:'已扫描，请在手机上确认',initializing:'已确认，QQ 正在准备上线',reconnecting:'正在重新连接 QQ'};el('state').textContent=d.online?'QQ 已在线'+(d.bot_qq?' · '+d.bot_qq:''):phases[d.phase]||(d.state==='waiting_scan'?'等待手机 QQ 扫码':d.error||'正在启动 QQ…');el('qr').hidden=!d.qr_image||d.online;if(d.qr_image&&el('qr').getAttribute('src')!==d.qr_image)el('qr').src=d.qr_image;el('hint').textContent=d.online?'手机登录已完成，可以用主号和 Bot 私聊。':'使用 Bot 小号的手机 QQ 扫码，并在手机上确认登录。';el('refresh').disabled=!d.enabled||d.online;el('pairing').hidden=!d.bind_command;el('command').textContent=d.bind_command||'';el('owner').textContent=d.owner_qq?'已绑定主号 '+d.owner_qq+' · 与本地 Web 共用记忆':'';}catch(e){el('state').textContent='正在等待 Bot 重新连接…';}finally{polling=false;}}
el('refresh').onclick=async()=>{el('refresh').disabled=true;try{await fetch(base+'qq/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});}finally{await update();}};
update();setInterval(update,5000);
</script></body></html>
